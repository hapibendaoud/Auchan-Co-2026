<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./CSS/output.css" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <header class="w-full h-20 shadow fixed bg-white">
        <nav class="wfull h-full flex items-center mx-8 ">
            <div class="flex items-center w-[25%] justify-around">
                <img class="w-40 h-auto" src="img/Mart Logo.png" alt="Logo">
                <div class="flex items-center gap-x-2 border border-white rounded-lg px-2.5 py-1.5 mx-3 cursor-pointer hover:border hover:border-gray-400 hover:bg-gray-100">
                    <label for="menu-toggle" class="text-2xl text-gray-500">&#9776;</label>
                    <p class="text-lg font-bold">Rayons</p>
                </div>
                <p class="text-red-600 text-lg font-bold ">Promos</p>
            </div>
            <div class="w-[50%] bg-gray-200 rounded-md px-1.5 mx-4">
                <input id="filterInput" class="w-[85%] h-8 focus:outline-none focus:ring-0 px-2.5 py-1" type="text" placeholder="Search fo product">
            </div>
            <div class="flex items-center w-[25%] justify-around ">
                <p id="basket_btn" class="text-lg font-bold  px-4 py-2 rounded-lg border border-white hover:border hover:border-gray-400 hover:bg-gray-100 cursor-pointer static">
                    My Products
                    <div id="bascket_quantity" class="px-1 py-0.5 bg-red-600 relative bottom-3 right-13 rounded-2xl text-white flex items-center justify-center font-bold"></div>
                </p>
                <p class="text-lg font-bold text-red-600"><span id="product_montant">0</span>DH</p>
            </div>
        </nav>
    </header>
    <main class="px-10 bg-gray-100 pt-20">
        <div class="w-full h-fit bg-amber-300 flex flex-col justify-center gap-4 py-16">
            <div class="w-full flex items-end gap-5">
                <h2 class="text-4xl font-extrabold">Promos</h2>
                <p class="text-gray-500"><span>1000</span> products</p>
            </div>
            <div id="category" class="w-full flex flex-wrap gap-2.5">
            </div>
        </div>
        <div class="w-full h-fit flex items-center justify-between py-6">
            <div class="w-fit h-fit flex items-center">
                <div class="flex items-center gap-5">
                    <select class="rounded-lg px-5 py-3 bg-gray-100 border border-gray-400 text-gray-600" name="" id="">
                        <option value="" selected>Right Now</option>
                        <option value="">ssss</option>
                        <option value="">ssss</option>
                    </select>
                    <select class="rounded-lg px-5 py-3 bg-gray-100 border border-gray-400 text-gray-600" name="" id="">
                        <option value="" selected >Brand</option>
                        <option value="">ssss</option>
                        <option value="">ssss</option>
                    </select>
                    <div for="bio-toggle" class="flex gap-1.5 px-4 py-3 border border-gray-400 rounded-lg bg-gray-100">
                        <input type="checkbox"  name="" id="bio-toggle">
                        <label for="bio-toggle">Bio</label>
                    </div>
                    <select class="rounded-lg px-5 py-3 bg-gray-100 border border-gray-400 text-gray-600" name="" id="">
                        <option value="" selected>Custome rating</option>
                        <option value="" >Custome rating</option>
                        <option value="" >Custome rating</option>
                    </select>
                    <div  class="flex gap-1.5 px-4 py-3 border border-gray-400 rounded-lg bg-gray-100">
                        <input type="checkbox" name=""id="new-toggle">
                        <label for="new-toggle">New</label>
                    </div>
                </div>
                <!-- <Button  type="submit">Filter</Button> -->
            </div>
            <div class="flex flex-col justify-center border border-gray-500 px-6 py-1.5 rounded-lg bg-gray-100 ">
                <p class="text-xs">Sort by</p>
                <select class="focus:outline-none focus:ring-0" name="" id="">
                    <option value="" selected>default</option>
                </select>
            </div>
        </div>
        <div id="product_cards" class="w-full h-fit grid grid-cols-5 gap-8 py-10 static">
            
        </div>
        <div id="basket_popup" class="hidden fixed inset-0 z-50 flex justify-end bg-[#dbdbdb]/15 backdrop-blur-[6px] backdrop-saturate-200">
            <div class="w-120 h-screen max-h-screen bg-gray-100 opacity-100 flex flex-col">
                <div class="flex justify-between items-center w-full px-8 py-5 shadow rounded-b-2xl bg-gray-100 z-10 shrink-0">
                    <h3 class="font-bold text-lg text-red-700">My Basket</h3>
                    <p id="close_popup" class="flex justify-center items-center w-8 h-8 pb-1.5 text-red-600 rounded-2xl bg-gray-200 text-2xl cursor-pointer font-bold">x</p>
                </div>
                
                <div id="basket_div" class="w-full p-5 flex flex-col gap-3 overflow-y-auto flex-1">
                    <!-- cards ... -->
                </div>
                <div class="w-full h-fit bg-gray-200 p-3.5 flex justify-end items-center rounded-t-2xl ">
                    <button class="px-6 py-3 bg-red-700 rounded-2xl text-lg font-bold text-gray-100 hover:bg-red-500" type="submit">Buy All</button>
                </div>
            </div>
        </div>
    </main>
    <div class="pagination flex justify-center items-center gap-2 py-8"></div>
    

    </div>
    <footer class="w-full h-30 flex flex-col items-center justify-center bg-blue-900 gap-8">
        <li class="list-none flex gap-4 text-gray-100">
            <ul>Our general conditions</ul>
            <ul>Legal Notice</ul>
            <ul>Conditions of offers and promotions</ul>
            <ul>Cookie settings</ul>
            <ul>Privacy Policy</ul>
            <ul>Marketplace legal information</ul>
        </li>
        <p class="text-gray-100">Auchan 2026 © All rights reserved</p>
    </footer>


    <script type="module" src="js/main.js"></script>
</body>
</html>
