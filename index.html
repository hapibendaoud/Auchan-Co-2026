        </div>

        <div class="w-[35%] sm:w-[45%] bg-gray-100 border border-gray-200 rounded-md flex items-center px-2 sm:px-3 py-1">
            <input id="filterInput" class="w-full bg-transparent h-9 focus:outline-none text-gray-700 px-1 text-sm sm:text-base" type="text" placeholder="Search for products">

        <div class="flex items-center gap-3 sm:gap-6">
